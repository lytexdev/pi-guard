# Optional Docker Compose deployment; see docs/docker.md.
# Set CAMERA_DEVICE to the stable path of your camera (ls /dev/v4l/by-id/).
services:
  pi-guard:
    build: .
    image: pi-guard:local
    restart: unless-stopped
    env_file: .env
    environment:
      # The container's own paths; these override values from .env.
      PI_GUARD_DATA_DIR: /data
      PI_GUARD_RECORDINGS_DIR: /recordings
      PI_GUARD_CONFIG_FILE: /config/config.yaml
      PI_GUARD_RUNTIME_DIR: /run/pi-guard
    volumes:
      - ./config:/config:ro
      - ./data:/data
      - ./recordings:/recordings
    ports:
      # Web dashboard; only listens when PI_GUARD_DASHBOARD_ENABLED=true.
      - "${DASHBOARD_PORT:-8443}:8443"
    devices:
      - ${CAMERA_DEVICE:-/dev/video0}:${CAMERA_DEVICE:-/dev/video0}
      # Uncomment for audio:
      # - /dev/snd:/dev/snd
    # Numeric group IDs of "video" and "audio" on the host (getent group video audio).
    group_add:
      - "${VIDEO_GID:-44}"
      - "${AUDIO_GID:-29}"
    tmpfs:
      - /run/pi-guard:uid=10001,gid=10001,mode=0750
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1200m
    # Presence detection reads the neighbour table of the network namespace it runs in.
    # On the default bridge network it only sees the container's own neighbours; use the
    # FRITZ!Box source, or opt into host networking deliberately:
    # network_mode: host

  # Optional network-wide ad blocking and DNS: docker compose --profile pihole up -d
  # Then set PI_GUARD_PIHOLE_ENABLED=true and PI_GUARD_PIHOLE_URL=http://pihole in .env,
  # and make the router hand out this machine's address as DNS server.
  pihole:
    profiles: [pihole]
    image: pihole/pihole:latest
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "${PIHOLE_WEB_PORT:-8080}:80/tcp"
    environment:
      TZ: ${PI_GUARD_TIMEZONE:-Europe/Berlin}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:-}
      FTLCONF_dns_listeningMode: all
    volumes:
      - ./pihole:/etc/pihole

