[package]
name = "pi-guard-agent"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Connects a computer to pi-guard: status, safe shutdown and Docker, without an open port"

[dependencies]
tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
