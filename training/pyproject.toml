[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-guard-train"
version = "0.1.0"
description = "Train and tune pi-guard's detection on a computer with a GPU. Pictures stay on that computer."
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Immanuel Mruk" }]
# pi-guard itself is installed from the folder above (`pip install -e ..[vision]`), so the
# computer judges faces and people with exactly the code and models of the Pi.
dependencies = [
    "typer>=0.12",
    "numpy>=1.26",
    "aiohttp>=3.13",
    "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
# Training the person detector. torch and torchvision come from the CUDA index, see docs/training.md.
gpu = ["onnx>=1.15"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-aiohttp>=1.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
pgtrain = "pgtrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pgtrain = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["gpu: needs CUDA and the training packages"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]
ignore = ["S101", "S603", "S607", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PTH"]
"src/pgtrain/cli.py" = ["B008"]  # typer reads its options from default values

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
