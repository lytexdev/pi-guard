[package]
name = "pi-guard-vpn"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "VPN service of pi-guard: tunnel, kill switch, split tunneling and post-quantum keys"

[workspace]
members = ["kem"]

[dependencies]
pi-guard-kem = { path = "kem" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
