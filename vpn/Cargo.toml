[package]
name = "pi-guard-vpn"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "VPN service of pi-guard: tunnel, kill switch, split tunneling and post-quantum keys"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
