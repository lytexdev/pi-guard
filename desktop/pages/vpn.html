<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
  <title>PiGuard VPN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wide">
    <div class="state" id="dot"></div>
    <h1 id="title"></h1>
    <p id="detail"></p>
    <button id="toggle"></button>
    <p class="error" id="problem" role="alert"></p>
    <section id="missing" class="hidden">
      <p id="missing-text"></p>
      <code>cd pi-guard/vpn &amp;&amp; cargo build --release &amp;&amp; cd .. &amp;&amp; sudo ./scripts/install-vpn.sh</code>
    </section>
    <section id="settings" class="hidden">
      <p id="always" class="hidden"></p>
      <label class="switch"><input type="checkbox" id="kill_switch"><span id="l_kill"></span></label>
      <label class="switch"><input type="checkbox" id="lockdown"><span id="l_lock"></span></label>
      <label class="switch"><input type="checkbox" id="auto_connect"><span id="l_auto"></span></label>
      <label class="switch"><input type="checkbox" id="allow_lan"><span id="l_lan"></span></label>
      <label class="switch"><input type="checkbox" id="quantum"><span id="l_pq"></span></label>
      <h2 id="split-title"></h2>
      <p id="split-text"></p>
      <form id="split"><input id="program" placeholder="firefox"><button type="submit" class="second" id="split-go"></button></form>
    </section>
    <button id="back" class="second"></button>
  </main>
  <script src="vpn-page.js"></script>
</body>
</html>
